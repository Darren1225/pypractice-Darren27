[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banknote-classifier"
version = "0.1.0"
description = "Lab2 Practice: Banknote classification system using strategy and registry design patterns."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.68.4",
]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/banknote_classifier"]

[tool.pytest.ini_options]
pythonpath = ["."]